# Logrotate configuration for application logs
# Place in /etc/logrotate.d/app-logs

/var/log/app/*.log {
    # Rotate daily or whenever a single log file exceeds 10MB
    daily
    maxsize 10M

    # Keep 7 rotated cycles before removing oldest
    rotate 7

    # Compress rotated files with gzip to save space
    compress
    delaycompress

    # Do not throw error if the log file is missing
    missingok

    # Do not rotate empty files
    notifempty

    # Important: copytruncate truncates the original file in place after copying.
    # This keeps the running application's open file descriptor valid without a restart.
    copytruncate

    # Secure permissions on created archive files
    create 0640 appuser appgroup
}
